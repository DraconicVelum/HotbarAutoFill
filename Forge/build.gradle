buildscript {
	repositories {
		mavenCentral()
		maven {
			name = 'forge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'sonatype'
			url = 'https://oss.sonatype.org/content/repositories/snapshots/'
		}
	}
	dependencies {
		classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
	}
}

import net.minecraftforge.gradle.delayed.DelayedString
import groovy.json.JsonSlurper

apply plugin: 'forge'
apply plugin: 'maven-publish'

def archiveVersionWithMinecraft = "${project.minecraft_release_version}-${project.mod_version}"

version = archiveVersionWithMinecraft
archivesBaseName = "${project.archives_base_name}-forge"

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
	mavenCentral()
}

minecraft {
	version = "${project.minecraft_version}-${project.forge_version}"
	runDir = 'run'
	replace '@VERSION@', project.mod_version
	replaceIn 'HotbarAutoFillMod.java'
}

tasks.getByName('downloadClient').setUrl(new DelayedString(
		project,
		'https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar'
))
tasks.getByName('downloadServer').setUrl(new DelayedString(
		project,
		'https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar'
))

task prepareLegacyAssets {
	description = 'Downloads Minecraft 1.7.10 asset metadata and missing assets from current Mojang HTTPS endpoints.'
	group = 'ForgeGradle'

	doLast {
		def minecraftCache = new File(gradle.gradleUserHomeDir, 'caches/minecraft')
		def metadataDir = new File(minecraftCache, 'legacy-metadata')
		def assetIndexFile = new File(minecraftCache, 'assets/indexes/1.7.10.json')
		def assetObjectsDir = new File(minecraftCache, 'assets/objects')
		def versionJsonFile = new File(metadataDir, '1.7.10.json')

		downloadIfMissing(
				'https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json',
				versionJsonFile
		)

		def versionJson = new JsonSlurper().parse(versionJsonFile)
		downloadIfMissing(versionJson.assetIndex.url, assetIndexFile)

		def assetIndex = new JsonSlurper().parse(assetIndexFile)
		def checked = 0
		def downloaded = 0
		assetIndex.objects.each { ignoredName, asset ->
			checked++
			def hash = asset.hash
			def targetFile = new File(new File(assetObjectsDir, hash.substring(0, 2)), hash)
			if (targetFile.isFile() && targetFile.length() == asset.size) {
				return
			}

			downloadIfMissing("https://resources.download.minecraft.net/${hash.substring(0, 2)}/${hash}", targetFile, asset.size)
			downloaded++
		}

		logger.lifecycle("Prepared Minecraft 1.7.10 assets: ${checked} checked, ${downloaded} downloaded.")
	}
}

tasks.getByName('getAssetsIndex').dependsOn prepareLegacyAssets
tasks.getByName('getAssets').dependsOn prepareLegacyAssets

def downloadIfMissing(String url, File targetFile, Long expectedSize = null) {
	if (targetFile.isFile() && (expectedSize == null || targetFile.length() == expectedSize)) {
		return
	}

	targetFile.parentFile.mkdirs()
	def partialFile = new File(targetFile.parentFile, "${targetFile.name}.part")
	if (partialFile.exists()) {
		partialFile.delete()
	}

	new URL(url).withInputStream { input ->
		partialFile.withOutputStream { output ->
			output << input
		}
	}

	if (expectedSize != null && partialFile.length() != expectedSize) {
		partialFile.delete()
		throw new GradleException("Downloaded ${url} with unexpected size.")
	}

	if (targetFile.exists()) {
		targetFile.delete()
	}
	partialFile.renameTo(targetFile)
}

processResources {
	inputs.property 'version', project.mod_version
	inputs.property 'minecraft_version_range', project.minecraft_version_range

	from(sourceSets.main.resources.srcDirs) {
		include 'mcmod.info'
		expand(
				'version': inputs.properties.version,
				'minecraft_version_range': inputs.properties.minecraft_version_range
		)
	}

	from(sourceSets.main.resources.srcDirs) {
		exclude 'mcmod.info'
	}
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

task sourcesJar(type: Jar) {
	from sourceSets.main.allSource
	classifier = 'sources'
	version = archiveVersionWithMinecraft
}

artifacts {
	archives sourcesJar
}
