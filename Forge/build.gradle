buildscript {
	repositories {
		mavenCentral()
		maven {
			name = 'forge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			name = 'sonatype'
			url = 'https://oss.sonatype.org/content/repositories/snapshots/'
		}
	}
	dependencies {
		classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.+'
	}
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'maven-publish'

def archiveVersionWithMinecraft = "${project.minecraft_release_version}-${project.mod_version}"

version = archiveVersionWithMinecraft
archivesBaseName = "${project.archives_base_name}-forge"

sourceCompatibility = JavaVersion.VERSION_16
targetCompatibility = JavaVersion.VERSION_16

repositories {
	mavenCentral()
}

minecraft {
	mappings channel: 'official', version: project.minecraft_version

	runs {
		client {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'SCAN,REGISTRIES'
			property 'forge.logging.console.level', 'debug'

			mods {
				hotbarautofill {
					source sourceSets.main
				}
			}
		}
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property 'version', project.mod_version
	inputs.property 'minecraft_version_range', project.minecraft_version_range

	filesMatching('META-INF/mods.toml') {
		expand(
				'version': project.mod_version,
				'minecraft_version_range': project.minecraft_version_range
		)
	}
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

task sourcesJar(type: Jar) {
	from sourceSets.main.allSource
	archiveClassifier = 'sources'
	version = archiveVersionWithMinecraft
}

artifacts {
	archives sourcesJar
}
