plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

def archiveVersionWithMinecraft = "${project.minecraft_release_version}-${project.mod_version}"
def toGradleLowerBoundRange = { value ->
	"[${value.replace('>=', '').trim()},)"
}
def neoforgeVersionRange = toGradleLowerBoundRange(project.neoforge_version_range)

base {
	archivesName = "${project.archives_base_name}-neoforge"
}

repositories {
	mavenCentral()
	maven { url = "https://maven.neoforged.net/releases" }
}

neoForge {
	version = project.neoforge_version

	mods {
		hotbarautofill {
			sourceSet sourceSets.main
		}
	}

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "loader_version_range", "[11,)"
	inputs.property "neoforge_version_range", neoforgeVersionRange

	filesMatching("META-INF/neoforge.mods.toml") {
		expand(
			"version": inputs.properties.version,
			"loader_version_range": inputs.properties.loader_version_range,
			"neoforge_version_range": inputs.properties.neoforge_version_range
		)
	}
}

tasks.named("jar") {
	archiveVersion = archiveVersionWithMinecraft
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
	archiveVersion = archiveVersionWithMinecraft
}

jar {
	inputs.property "archivesName", project.base.archivesName

	def licenseFile = rootProject.file("LICENSE")
	if (licenseFile.exists()) {
		from(licenseFile) {
			rename { "${it}_${inputs.properties.archivesName}" }
		}
	}
}
