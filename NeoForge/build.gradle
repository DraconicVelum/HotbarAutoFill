plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.gradle.userdev' version '7.1.39'
}

def archiveVersionWithMinecraft = "${project.minecraft_release_version}-${project.mod_version}"
def toGradleLowerBoundRange = { value ->
	"[${value.replace('>=', '').trim()},)"
}
def neoforgeVersionRange = toGradleLowerBoundRange(project.neoforge_version_range)

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-neoforge"
}

repositories {
	mavenCentral()
	maven { url = "https://maven.neoforged.net/releases" }
}

runs {
	configureEach {
		systemProperty 'forge.logging.markers', 'REGISTRIES'
		systemProperty 'forge.logging.console.level', 'debug'
		workingDirectory project.layout.projectDirectory.dir('run').dir(name)
		modSource project.sourceSets.main
	}

	client {
		systemProperty 'neoforge.enabledGameTestNamespaces', 'hotbarautofill'
	}

	server {
		systemProperty 'neoforge.enabledGameTestNamespaces', 'hotbarautofill'
		argument '--nogui'
	}
}

dependencies {
	implementation "net.neoforged:neoforge:${project.neoforge_version}"
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", project.mod_version
	inputs.property "loader_version_range", "[1,)"
	inputs.property "neoforge_version_range", neoforgeVersionRange

	filesMatching("META-INF/neoforge.mods.toml") {
		expand(
				"version": inputs.properties.version,
				"loader_version_range": inputs.properties.loader_version_range,
				"neoforge_version_range": inputs.properties.neoforge_version_range
		)
	}
}

tasks.named("jar") {
	archiveVersion = archiveVersionWithMinecraft
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

java {
	withSourcesJar()
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
	archiveVersion = archiveVersionWithMinecraft
}

jar {
	inputs.property "archivesName", project.base.archivesName

	def licenseFile = rootProject.file("LICENSE")
	if (licenseFile.exists()) {
		from(licenseFile) {
			rename { "${it}_${inputs.properties.archivesName}" }
		}
	}
}
